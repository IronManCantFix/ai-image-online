name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Generate build metadata
      id: meta_build
      run: |
        echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
        SHORT_SHA="${GITHUB_SHA:0:7}"
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          # 发版：版本号直接取 tag（如 v0.1.0 -> 0.1.0）
          APP_VERSION="${GITHUB_REF#refs/tags/v}"
        else
          # 日常构建：package.json 版本 + 构建号与提交号
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          APP_VERSION="${PKG_VERSION}+build.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
        fi
        echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ steps.meta_build.outputs.app_version }}
          BUILD_NUMBER=${{ github.run_number }}
          BUILD_TIME=${{ steps.meta_build.outputs.build_time }}
          GIT_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false
        sbom: false

    - name: Generate artifact attestation
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
