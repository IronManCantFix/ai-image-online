version: "3.8"

services:
  ai-image-online:
    image: ai-image-online:latest
    container_name: ai-image-online
    ports:
      - "{host_port}:19090"
    volumes:
      - "/var/apps/ai-image-online/data:/app/data"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
    restart: unless-stopped
